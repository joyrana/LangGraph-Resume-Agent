services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:latest}
      RESUME_STORAGE_DIR: /data
    volumes:
      - resume-data:/data
    depends_on:
      ollama:
        condition: service_started
        required: false

  # Optional local model: `docker compose --profile ollama up`, then `docker compose exec ollama ollama pull gpt-oss`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  resume-data:
  ollama-models:
