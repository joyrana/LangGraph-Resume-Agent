services:
  api:
    build: .
    ports:
      - "8001:8000"   # host 8000 is the local mlx-lm model server
    env_file:
      - path: .env
        required: false
    environment:
      # mlx-lm runs on the Mac host (Metal is not available inside containers).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8000/v1}
      RESUME_STORAGE_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; built in on Docker Desktop
    volumes:
      - resume-data:/data

volumes:
  resume-data:
