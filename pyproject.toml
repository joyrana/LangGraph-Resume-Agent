[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-resume-agent"
version = "0.3.0"
description = "Evidence-backed, user-approved edits to an uploaded DOCX resume with layout-preservation gates"
requires-python = ">=3.11,<3.14"
keywords = ["langgraph", "fastapi", "docx", "resume", "ollama"]
# Lower bounds are the versions this code was developed and tested against;
# upper bounds cap the next major release. Generate a lock file with `uv lock`.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langgraph>=0.4,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2,<2",
    "lxml>=5.2,<7",
    "pillow>=10.3,<13",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<6",
    "scikit-image>=0.22,<1",
    "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "renderer: requires LibreOffice and pdftoppm",
    "live_llm: calls the configured LLM provider (set RUN_LIVE_LLM_TESTS=1)",
    "requires_fastapi: requires FastAPI to be installed",
    "requires_langgraph: requires LangGraph to be installed",
]
filterwarnings = ["ignore::DeprecationWarning:docx.*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# UP042: str+Enum is deliberate (StrEnum changes str() output used in JSON/DB values).
# S105 in fidelity_models: "PASS" is a gate status, not a password.
ignore = ["E501", "S101", "S603", "S607", "B008", "S311", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "B017"]
"app/evaluation/**" = ["S108"]
"app/document/fidelity_models.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
